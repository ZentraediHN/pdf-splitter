name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install PyPDF2 pikepdf pyinstaller

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PDFSplitter" splitter-pdfs.py

      - name: Subir Ejecutable como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFSplitter-Windows-Exe
          path: dist/PDFSplitter.exe
          retention-days: 7
